<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Course Cove</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="popup-brand"><img class="popup-brand-icon" src="icons/icon32.png" alt="" aria-hidden="true"><div><strong>Course Cove</strong><span>Video subtitles to Obsidian</span></div></div><button id="settings" class="quiet">配置 Obsidian</button></header>
  <main id="clipper">
    <form id="source-form"><label for="url">视频链接</label><div class="source-row"><input id="url" placeholder="B站或 YouTube 视频链接" spellcheck="false" autocomplete="off"><button id="read" class="secondary">读取</button></div></form>
    <p id="status" role="status" aria-live="polite">打开 B站或 YouTube 视频，或粘贴链接开始。</p>
    <section id="video" hidden><p id="course-name" class="muted"></p><h1 id="part-name"></h1><div class="preview-heading"><h2>字幕预览</h2><div id="language-picker" class="language-picker"><button id="language-trigger" class="language-trigger" type="button" aria-label="选择当前视频字幕轨" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options"><span id="language-label">自动（推荐）</span><span class="language-chevron" aria-hidden="true"></span></button><div id="language-options" class="language-options" role="listbox" aria-label="选择当前视频字幕轨" hidden></div></div></div><p id="subtitle-track" class="muted" role="status"></p><div id="subtitles" tabindex="0" aria-label="字幕内容"></div><button id="asr-open" class="secondary" hidden>本地转写并导入</button><p class="destination">保存到 <span id="folder"></span></p></section>
    <div class="actions"><button id="import" disabled>导入当前视频</button><button id="workspace" class="secondary">批量导入整门课</button></div>
    <p id="workspace-hint" class="footnote">按章整理和多选导入，请进入课程工作台。</p>
  </main>
  <section id="connection" hidden aria-labelledby="settings-title">
    <div class="settings-heading"><h1 id="settings-title">连接 Obsidian</h1><button id="back" class="quiet">返回</button></div>
    <p class="muted">打开 Obsidian，在 Local REST API 插件设置中复制地址和 Key。</p>
    <label for="api-url">服务地址</label><input id="api-url" type="url" spellcheck="false">
    <label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="粘贴 Local REST API Key">
    <label for="note-folder">素材根目录</label><input id="note-folder" spellcheck="false">
    <p class="muted">目录相对于笔记库，例如 Clippings/Bilibili。</p>
    <div class="actions"><button id="test" class="secondary">测试连接</button><button id="save">保存设置</button></div><p id="settings-status" role="status" aria-live="polite"></p>
  </section>
  <script src="course-core.js"></script><script src="subtitle-language.js"></script><script src="popup.js"></script>
</body>
</html>
