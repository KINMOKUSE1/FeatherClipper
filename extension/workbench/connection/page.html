<section id="connection-page" class="configuration-page" aria-labelledby="settings-title" hidden>
  <div class="settings-scroll">
  <header class="preferences-heading"><h1 id="settings-title"><span data-i18n="连接配置">连接配置</span></h1><p class="section-description"><span data-i18n="连接 Obsidian，将课程素材保存到你的笔记库。">连接 Obsidian，将课程素材保存到你的笔记库。</span></p></header>
  <div class="configuration-fields settings-group">
    <div class="configuration-intro"><span>Obsidian · Local REST API</span><span id="connection-state" class="configuration-state"><span data-i18n="未配置">未配置</span></span></div>
    <div class="configuration-field settings-row"><label for="api-url"><span data-i18n="服务地址">服务地址</span></label><input id="api-url" type="url" placeholder="http://127.0.0.1:27123" spellcheck="false"></div>
    <div class="configuration-field settings-row"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off"><p class="field-help"><span data-i18n="在 Obsidian 的 Local REST API 设置中复制。">在 Obsidian 的 Local REST API 设置中复制。</span></p></div>
    <div class="configuration-field settings-row"><label for="default-folder"><span data-i18n="默认素材根目录">默认素材根目录</span></label><input id="default-folder" spellcheck="false"><p class="field-help"><span data-i18n="仅影响后续导入，已有文件保留在原目录。">仅影响后续导入，已有文件保留在原目录。</span></p></div>
  </div>
  </div>
  <footer class="configuration-footer"><div class="settings-footer-info"><div class="settings-feedback" hidden><p id="settings-status" role="status" aria-live="polite"></p><button class="settings-feedback-close" type="button" aria-label="关闭提示" data-i18n-aria-label="关闭提示">×</button></div></div><div class="configuration-actions"><button id="test-settings" class="text-button" type="button"><span class="icon icon-link" aria-hidden="true"></span><span data-i18n="测试连接">测试连接</span></button><button id="save-settings" type="button"><span data-i18n="保存配置">保存配置</span></button></div></footer>
</section>
