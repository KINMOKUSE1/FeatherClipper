<section id="asr-page" class="configuration-page asr-settings" aria-labelledby="asr-title" hidden>
  <div class="settings-scroll">
  <header class="preferences-heading"><h1 id="asr-title"><span data-i18n="音频转写">音频转写</span></h1><p class="section-description"><span data-i18n="为没有字幕的课程转写音频，使用本地模型或在线服务。">为没有字幕的课程转写音频，使用本地模型或在线服务。</span></p></header>
  <div class="configuration-fields settings-group">
    <div class="settings-row"><label for="asr-provider"><span data-i18n="转写引擎">转写引擎</span></label><select id="asr-provider"><option value="local" data-i18n="本地模型">本地模型</option><option value="groq">Groq</option><option value="siliconflow" data-i18n="硅基流动">硅基流动</option></select><p id="asr-provider-help" class="field-help"><span data-i18n="音频在本机处理">音频在本机处理</span></p></div>
    <div id="asr-local-fields">
    <div class="configuration-intro"><span><span data-i18n="本地转写组件">本地转写组件</span></span><span id="asr-state" class="configuration-state"><span data-i18n="未连接">未连接</span></span></div>
    <div id="asr-pair-fields" class="configuration-field settings-row"><label for="asr-token"><span data-i18n="连接码">连接码</span></label><input id="asr-token" type="password" autocomplete="off" placeholder="粘贴组件提供的连接码" data-i18n-placeholder="粘贴组件提供的连接码"><p class="field-help"><span data-i18n="首次连接时填写，之后可直接检测服务。">首次连接时填写，之后可直接检测服务。</span></p></div>
    </div>
    <div id="asr-key-row" class="settings-row" hidden><label for="asr-api-key">API Key</label><input id="asr-api-key" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴服务商 API Key" data-i18n-placeholder="粘贴服务商 API Key"><p class="field-help"><span data-i18n="仅存本机 ·">仅存本机 ·</span> <a id="asr-key-link" href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer"><span data-i18n="获取 Key ↗">获取 Key ↗</span></a></p></div>
    <div class="settings-row"><label><span data-i18n="模型">模型</span></label><p id="asr-model" class="asr-setting-value">faster-whisper-small</p></div>
    <div class="settings-row"><label><span data-i18n="用量">用量</span></label><p id="asr-policy" class="asr-setting-value asr-policy"><span data-i18n="使用本机 CPU / GPU">使用本机 CPU / GPU</span></p></div>
  </div>
  <section id="asr-install-guide" class="configuration-guide" aria-labelledby="asr-guide-title"><h2 id="asr-guide-title" class="preference-group-title"><span data-i18n="安装与启动">安装与启动</span></h2><ol class="setup-steps settings-group"><li><a href="../featherclipper-asr-setup.exe" download="featherclipper-asr-setup.exe"><span data-i18n="下载安装程序">下载安装程序</span></a><span data-i18n="，选择 CPU 或 NVIDIA GPU。">，选择 CPU 或 NVIDIA GPU。</span></li><li><span data-i18n="安装完成后启动本地组件，复制连接码。">安装完成后启动本地组件，复制连接码。</span></li><li><span data-i18n="在上方填写连接码，点击“保存配置”，回到课程素材页开始转写。">在上方填写连接码，点击“保存配置”，回到课程素材页开始转写。</span></li></ol></section>
  </div>
  <footer class="configuration-footer"><div class="settings-footer-info"><div class="settings-feedback" hidden><p id="asr-settings-status" role="status" aria-live="polite"></p><button class="settings-feedback-close" type="button" aria-label="关闭提示" data-i18n-aria-label="关闭提示">×</button></div></div><div class="configuration-actions"><button id="asr-clear-key" class="text-button" type="button" hidden><span data-i18n="清除 Key">清除 Key</span></button><button id="asr-refresh" class="text-button" type="button"><span class="icon icon-retry" aria-hidden="true"></span><span data-i18n="检测组件">检测组件</span></button><button id="asr-connect" type="button"><span data-i18n="保存配置">保存配置</span></button></div></footer>
</section>
