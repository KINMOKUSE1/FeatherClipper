<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vid2Notes · 课程工作台</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="catalog/style.css">
    <link rel="stylesheet" href="notes/style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="工作台导航">
        <div class="brand"><img src="../shared/icons/icon128.png" alt=""><strong>Vid2Notes</strong></div>
        <button id="catalog-nav" class="nav-button active" type="button"><span class="icon icon-chapters" aria-hidden="true"></span>课程素材</button>
        <button id="notes-nav" class="nav-button" type="button"><span class="icon icon-notes" aria-hidden="true"></span>整理笔记</button>
        <button id="local-asr-settings" class="nav-button" type="button"><span class="icon icon-audio" aria-hidden="true"></span>本地转写</button>
        <button id="settings" class="nav-button" type="button"><span class="icon icon-settings" aria-hidden="true"></span><span>连接配置</span></button>
      </aside>

      <main class="main-content">
        <p id="import-toast" class="import-toast" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        <div data-page="catalog"></div>
        <div data-page="notes"></div>
        <div data-page="connection"></div>
        <div data-page="transcription"></div>
      </main>
    </div>

    <script src="../shared/ui-text.js"></script>
    <script src="../shared/course.js"></script>
    <script src="notes/rules/defaults.js"></script>
    <script src="notes/generator.js"></script>
    <script src="notes/files.js"></script>
    <script src="feedback.js"></script>
    <script src="shell.js"></script>
    <script src="catalog/preview.js"></script>
    <script src="catalog/import-button.js"></script>
    <script src="connection/page.js"></script>
    <script src="transcription/page.js"></script>
    <script src="catalog/page.js"></script>
    <script src="notes/controls.js"></script>
    <script src="notes/materials.js"></script>
    <script src="notes/delivery.js"></script>
    <script src="notes/page.js"></script>
    <script src="app.js"></script>
  </body>
</html>
